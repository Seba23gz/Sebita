<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Interactivo — Italia Roadtrip</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Barlow+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d1219;
  --parchment:#f0ebe0;
  --sand:#e3ddd0;
  --stone:#9a8e80;
  --route:#002eff;
  --fire:#ff3d00;
  --mint:#41e8b4;
  --w:#fff;
  --panel-w:360px;
}
html,body{height:100%;overflow:hidden;font-family:'Barlow',sans-serif;background:var(--ink)}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;position:relative}

/* ── MAP AREA ── */
.map-area{
  flex:1;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 40% 30%, #141e3a 0%, #0a0f1e 60%, #060b15 100%);
}
#map-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#map-canvas.dragging{cursor:grabbing}

/* ── MARKERS (HTML overlay) ── */
.markers{position:absolute;inset:0;pointer-events:none}
.marker{
  position:absolute;pointer-events:all;cursor:pointer;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.marker-ring{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--fire);background:rgba(13,18,25,0.85);
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s, border-color .18s, background .18s;
  position:relative;z-index:2;
}
.marker-ring::before{
  content:'';position:absolute;inset:-5px;border-radius:50%;
  background:rgba(255,61,0,0.15);opacity:0;
  transition:opacity .18s;
}
.marker.active .marker-ring,
.marker:hover .marker-ring{
  background:var(--fire);border-color:var(--fire);transform:scale(1.3);
}
.marker.active .marker-ring::before,
.marker:hover .marker-ring::before{opacity:1}
.marker-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--fire);transition:background .18s;
}
.marker.active .marker-dot,
.marker:hover .marker-dot{background:var(--w)}
.marker-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.75);margin-top:5px;white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  transition:color .18s;
}
.marker.active .marker-label,
.marker:hover .marker-label{color:var(--w)}
.marker-num{
  position:absolute;top:-1px;right:-1px;
  width:13px;height:13px;border-radius:50%;
  background:var(--route);
  font-size:7px;font-weight:800;color:var(--w);
  display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
  border:1.5px solid var(--ink);
}

/* ── PANEL ── */
.panel{
  width:var(--panel-w);flex-shrink:0;
  background:var(--parchment);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  border-left:1px solid var(--sand);
}
.panel-header{
  background:var(--ink);padding:24px 28px 20px;flex-shrink:0;
}
.panel-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:22px;font-weight:900;color:var(--w);letter-spacing:-.01em;
}
.panel-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:3px}
.route-progress{
  display:flex;align-items:center;gap:0;margin-top:16px;
  overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
}
.route-progress::-webkit-scrollbar{display:none}
.prog-stop{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  flex-shrink:0;cursor:pointer;padding:0 6px;
  transition:opacity .15s;
}
.prog-stop:not(.prog-active){opacity:.35}
.prog-stop:hover{opacity:.8}
.prog-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--stone);border:1.5px solid var(--stone);
  transition:background .15s,border-color .15s;
}
.prog-active .prog-dot{background:var(--fire);border-color:var(--fire)}
.prog-line{width:16px;height:1px;background:rgba(255,255,255,.15);align-self:center;flex-shrink:0}
.prog-num{font-size:8px;font-weight:700;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums}
.prog-active .prog-num{color:var(--fire)}

/* ── CITY LIST ── */
.city-list{flex:1;overflow-y:auto;padding:8px 0}
.city-list::-webkit-scrollbar{width:4px}
.city-list::-webkit-scrollbar-track{background:transparent}
.city-list::-webkit-scrollbar-thumb{background:var(--sand);border-radius:2px}
.city-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 28px;cursor:pointer;
  border-bottom:1px solid var(--sand);
  transition:background .12s;position:relative;
}
.city-item:hover{background:rgba(0,46,255,.04)}
.city-item.active{background:rgba(0,46,255,.06)}
.city-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--route);
}
.city-item-num{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:800;color:var(--stone);
  font-variant-numeric:tabular-nums;width:20px;flex-shrink:0;
}
.city-item.active .city-item-num{color:var(--route)}
.city-item-info{flex:1;min-width:0}
.city-item-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;
  color:var(--ink);
}
.city-item-date{font-size:11px;color:var(--stone);font-weight:500;margin-top:1px}
.city-item-days{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:700;color:var(--stone);flex-shrink:0;
}

/* ── DETAIL PANEL (slides over city list) ── */
.detail{
  position:absolute;inset:0;top:0;
  background:var(--parchment);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
  z-index:10;
}
.detail.open{transform:translateX(0)}
.detail-top{
  background:var(--ink);padding:20px 24px;flex-shrink:0;
  display:flex;align-items:flex-start;gap:12px;
}
.detail-back{
  background:none;border:none;color:rgba(255,255,255,.5);
  font-size:20px;cursor:pointer;padding:0;line-height:1;
  transition:color .15s;flex-shrink:0;margin-top:2px;
}
.detail-back:hover{color:var(--w)}
.detail-back:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.detail-heading{flex:1}
.detail-stop{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fire);margin-bottom:6px}
.detail-city{
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(28px,5vw,38px);font-weight:900;color:var(--w);
  line-height:1;text-transform:uppercase;text-wrap:balance;
}
.detail-region{font-size:11px;color:rgba(255,255,255,.4);font-weight:500;margin-top:4px;letter-spacing:.1em;text-transform:uppercase}
.detail-body{flex:1;overflow-y:auto;padding:22px 24px}
.detail-body::-webkit-scrollbar{width:3px}
.detail-body::-webkit-scrollbar-thumb{background:var(--sand)}
.det-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sand)}
.det-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
.det-val{font-size:14px;font-weight:600;color:var(--ink);text-align:right}
.det-km{
  display:inline-flex;align-items:center;gap:5px;margin-top:14px;
  background:#e8eeff;color:var(--route);
  font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px;
  font-variant-numeric:tabular-nums;
}
.det-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.det-tag{
  background:var(--sand);color:var(--ink);
  font-size:11px;font-weight:600;padding:4px 10px;
}
.det-tag.h{background:var(--fire);color:var(--w)}
.det-tag.b{background:var(--route);color:var(--w)}
.det-desc{font-size:13.5px;line-height:1.72;color:#3d3530;margin-top:14px}
.det-tips{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.det-tip{display:flex;gap:8px;font-size:12px;color:#5a4f47;line-height:1.5}
.det-arr{color:var(--route);font-weight:700;flex-shrink:0}
.nav-btns{
  display:flex;border-top:1px solid var(--sand);flex-shrink:0;
}
.nav-btn{
  flex:1;padding:14px;background:none;border:none;cursor:pointer;
  font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--stone);transition:background .12s,color .12s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.nav-btn:hover{background:var(--sand);color:var(--ink)}
.nav-btn:focus-visible{outline:2px solid var(--route);outline-offset:-2px}
.nav-btn+.nav-btn{border-left:1px solid var(--sand)}

/* ── CONTROLS ── */
.controls{
  position:absolute;bottom:24px;left:24px;
  display:flex;flex-direction:column;gap:8px;z-index:5;
}
.ctrl-btn{
  width:38px;height:38px;border-radius:4px;
  background:rgba(13,18,25,.85);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.7);font-size:18px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;backdrop-filter:blur(8px);
}
.ctrl-btn:hover{background:rgba(255,255,255,.1);color:var(--w)}
.ctrl-btn:focus-visible{outline:2px solid var(--mint)}

/* ── LEGEND ── */
.legend{
  position:absolute;bottom:24px;right:24px;
  background:rgba(13,18,25,.85);border:1px solid rgba(255,255,255,.1);
  padding:14px 16px;font-size:11px;color:rgba(255,255,255,.55);
  backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px;
}
.leg-row{display:flex;align-items:center;gap:10px}
.leg-line{width:24px;height:2px;background:var(--route);display:flex;align-items:center;justify-content:center}
.leg-dash{width:24px;height:1px;border-top:2px dashed rgba(255,255,255,.25)}

/* ── TOOLTIP ── */
.tooltip{
  position:fixed;pointer-events:none;
  background:rgba(13,18,25,.92);border:1px solid rgba(255,255,255,.1);
  color:var(--w);font-size:11px;font-weight:600;
  padding:6px 10px;letter-spacing:.04em;text-transform:uppercase;
  transform:translate(-50%,-140%);
  opacity:0;transition:opacity .12s;
  backdrop-filter:blur(8px);white-space:nowrap;z-index:100;
}
.tooltip.show{opacity:1}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .app{flex-direction:column}
  .panel{width:100%;height:45vh;border-left:none;border-top:1px solid var(--sand)}
  #map-canvas{height:100%;width:100%}
  .legend{display:none}
  :root{--panel-w:100%}
}
@media(prefers-reduced-motion:reduce){
  .detail,.marker-ring{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <!-- MAP -->
  <div class="map-area" id="map-area">
    <canvas id="map-canvas"></canvas>
    <div class="markers" id="markers"></div>

    <div class="controls">
      <button class="ctrl-btn" id="zoom-in" title="Acercar" aria-label="Acercar">+</button>
      <button class="ctrl-btn" id="zoom-out" title="Alejar" aria-label="Alejar">−</button>
      <button class="ctrl-btn" id="reset-view" title="Centrar" aria-label="Centrar vista" style="font-size:14px">⌖</button>
    </div>

    <div class="legend">
      <div class="leg-row"><div class="leg-line"></div><span>Ruta del viaje</span></div>
      <div class="leg-row"><div class="leg-dash"></div><span>Excursión</span></div>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-title">Italia Roadtrip</div>
      <div class="panel-sub">Dic 2025 – Ene 2026 · 12 ciudades · ~2.100 km</div>
      <div class="route-progress" id="route-progress"></div>
    </div>
    <div class="city-list" id="city-list"></div>

    <!-- DETAIL SLIDE -->
    <div class="detail" id="detail">
      <div class="detail-top">
        <button class="detail-back" id="detail-back" aria-label="Volver">←</button>
        <div class="detail-heading">
          <div class="detail-stop" id="d-stop"></div>
          <div class="detail-city" id="d-city"></div>
          <div class="detail-region" id="d-region"></div>
        </div>
      </div>
      <div class="detail-body" id="d-body"></div>
      <div class="nav-btns">
        <button class="nav-btn" id="nav-prev">← Anterior</button>
        <button class="nav-btn" id="nav-next">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
const area = document.getElementById('map-area');

// Geographic bounds with padding
const GEO = { lonMin:7.5, lonMax:18.8, latMin:36.5, latMax:47.2 };

// Transform: geo → canvas (will be updated per frame)
let VIEW = { offsetX:0, offsetY:0, scale:1 };
let BASE_SCALE = 1;

function geoToNorm(lon, lat){
  const nx = (lon - GEO.lonMin) / (GEO.lonMax - GEO.lonMin);
  const ny = 1 - (lat - GEO.latMin) / (GEO.latMax - GEO.latMin);
  return [nx, ny];
}
function normToCanvas(nx, ny){
  const W = canvas.width, H = canvas.height;
  const mapW = W * 0.8, mapH = H * 0.9;
  const mapX = (W - mapW) / 2, mapY = (H - mapH) / 2;
  return [
    VIEW.offsetX + mapX + nx * mapW * VIEW.scale,
    VIEW.offsetY + mapY + ny * mapH * VIEW.scale
  ];
}
function geoToCanvas(lon, lat){
  return normToCanvas(...geoToNorm(lon, lat));
}

// Italy mainland outline (geographic coords, simplified)
const ITALY_MAIN = [
  // Alps: west to east
  [7.0,44.0],[7.5,44.2],[8.0,44.0],[8.5,44.1],[9.0,44.2],[9.5,45.0],
  [10.0,45.8],[10.5,46.0],[11.0,46.5],[11.5,46.6],[12.0,46.7],[12.5,46.8],
  [13.0,46.6],[13.5,46.3],[13.8,45.8],[13.7,45.7],[13.5,45.7],[13.0,45.5],
  // Northeast coast (Trieste area)
  [13.6,45.6],[13.8,45.5],
  // Adriatic coast south
  [13.5,45.0],[13.4,44.5],[13.8,44.0],[14.2,43.5],[14.5,42.9],[14.9,42.2],
  [15.2,41.8],[15.5,41.3],[15.8,40.6],[16.2,40.0],[16.6,39.5],[17.0,39.0],
  [17.5,38.6],[18.0,38.2],[18.5,38.1],[18.2,38.0],
  // Heel (Puglia)
  [18.0,38.1],[18.3,38.4],[18.4,38.9],[17.9,39.1],[17.5,39.2],[16.8,39.5],
  // Toe: Calabria
  [16.5,38.7],[16.0,38.0],[15.7,37.9],[15.6,38.0],[15.9,38.2],[16.1,38.5],
  [16.0,39.0],[15.7,39.5],[15.3,40.0],[15.0,40.3],[14.7,40.6],
  // Campania coast
  [14.5,40.5],[14.2,40.6],[13.9,40.8],[13.5,41.2],[13.2,41.5],
  // Lazio coast
  [12.8,41.8],[12.4,42.0],[12.0,42.2],[11.6,42.4],[11.2,42.5],
  // Tuscany coast
  [10.8,42.6],[10.5,43.0],[10.2,43.3],[9.9,43.8],[9.7,44.2],[9.0,44.0],
  // Liguria
  [8.5,43.8],[8.0,43.7],[7.5,43.5],[7.0,43.8],[6.8,44.0],[7.0,44.0]
];

const SICILY = [
  [12.4,38.2],[13.0,37.8],[13.5,37.5],[14.5,37.3],[15.1,37.5],[15.6,37.7],
  [15.4,38.1],[15.0,38.2],[14.5,38.0],[14.0,38.1],[13.5,38.0],[13.0,38.2],
  [12.5,38.2],[12.4,38.2]
];

const SARDINIA = [
  [8.4,38.9],[8.8,38.8],[9.2,39.0],[9.5,39.2],[9.6,39.8],[9.5,40.5],
  [9.2,41.0],[8.8,41.2],[8.5,41.0],[8.3,40.5],[8.2,40.0],[8.1,39.5],
  [8.3,39.0],[8.4,38.9]
];

function drawIsland(coords, fillA, strokeA){
  ctx.beginPath();
  coords.forEach(([lon,lat],i) => {
    const [x,y] = geoToCanvas(lon,lat);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = fillA; ctx.fill();
  ctx.strokeStyle = strokeA; ctx.lineWidth = 1; ctx.stroke();
}

// Route order (same as CITIES array order)
let routeProgress = 0; // 0..1 animated

function draw(){
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // Sea background grid — subtle
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // Mainland
  ctx.beginPath();
  ITALY_MAIN.forEach(([lon,lat],i) => {
    const [x,y] = geoToCanvas(lon,lat);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Islands
  drawIsland(SICILY,'rgba(255,255,255,0.05)','rgba(255,255,255,0.15)');
  drawIsland(SARDINIA,'rgba(255,255,255,0.04)','rgba(255,255,255,0.12)');

  // Route line
  const n = CITIES.length;
  const progPts = Math.floor(routeProgress * (n-1));
  const progFrac = (routeProgress * (n-1)) % 1;

  // Draw solid route for completed segments
  if(progPts > 0){
    ctx.save();
    ctx.strokeStyle = '#002eff';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8,5]);
    ctx.lineDashOffset = -routeProgress * 200;
    ctx.beginPath();
    for(let i=0;i<=progPts && i<n;i++){
      const c = CITIES[i];
      const [x,y] = geoToCanvas(c.lon, c.lat);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    // Partial segment
    if(progPts < n-1){
      const a = CITIES[progPts], b = CITIES[progPts+1];
      const [ax,ay] = geoToCanvas(a.lon,a.lat);
      const [bx,by] = geoToCanvas(b.lon,b.lat);
      ctx.lineTo(ax+(bx-ax)*progFrac, ay+(by-ay)*progFrac);
    }
    ctx.stroke();
    ctx.restore();
  }
}

// ── MARKERS ──
const markersEl = document.getElementById('markers');
const markerEls = [];

function updateMarkers(){
  const W = canvas.width, H = canvas.height;
  const mapW = W * 0.8, mapH = H * 0.9;
  const mapX = (W - mapW) / 2, mapY = (H - mapH) / 2;

  CITIES.forEach((city, i) => {
    const el = markerEls[i];
    if(!el) return;
    const [nx,ny] = geoToNorm(city.lon, city.lat);
    const x = VIEW.offsetX + mapX + nx * mapW * VIEW.scale;
    const y = VIEW.offsetY + mapY + ny * mapH * VIEW.scale;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    const visible = routeProgress >= i / (CITIES.length-1) - 0.01;
    el.style.opacity = visible ? '1' : '0';
    el.style.pointerEvents = visible ? 'all' : 'none';
  });
}

function buildMarkers(){
  CITIES.forEach((city, i) => {
    const el = document.createElement('div');
    el.className = 'marker';
    el.innerHTML = `
      <div class="marker-ring">
        <div class="marker-dot"></div>
        <div class="marker-num">${city.id}</div>
      </div>
      <div class="marker-label">${city.name.split(' ')[0]}</div>
    `;
    el.addEventListener('click', () => openDetail(i));
    el.addEventListener('mouseenter', (e) => showTooltip(e, city.name));
    el.addEventListener('mouseleave', hideTooltip);
    markersEl.appendChild(el);
    markerEls.push(el);
  });
}

let activeCity = -1;
function setActiveMarker(i){
  markerEls.forEach((el,j) => el.classList.toggle('active', j===i));
  document.querySelectorAll('.city-item').forEach((el,j) => el.classList.toggle('active', j===i));
  document.querySelectorAll('.prog-stop').forEach((el,j) => el.classList.toggle('prog-active', j===i));
  activeCity = i;
}

// ── TOOLTIP ──
const tooltip = document.getElementById('tooltip');
function showTooltip(e, text){
  tooltip.textContent = text;
  tooltip.style.left = e.clientX + 'px';
  tooltip.style.top  = e.clientY + 'px';
  tooltip.classList.add('show');
}
function hideTooltip(){ tooltip.classList.remove('show') }

// ── DETAIL PANEL ──
const detail = document.getElementById('detail');
function openDetail(i){
  const city = CITIES[i];
  setActiveMarker(i);
  document.getElementById('d-stop').textContent = `Parada ${String(city.id).padStart(2,'0')} de 12`;
  document.getElementById('d-city').textContent = city.name;
  document.getElementById('d-region').textContent = city.region;

  const body = document.getElementById('d-body');
  const tagsHtml = [
    ...city.tags.map(t=>`<span class="det-tag">${t}</span>`),
    ...city.hot.map(t=>`<span class="det-tag h">${t}</span>`)
  ].join('');

  body.innerHTML = `
    <div class="det-row"><span class="det-label">Fechas</span><span class="det-val">${city.dates}</span></div>
    <div class="det-row"><span class="det-label">Duración</span><span class="det-val">${city.days}</span></div>
    ${city.km ? `<div class="det-km">↔ ${city.km}</div>` : ''}
    <div class="det-tags">${tagsHtml}</div>
    <p class="det-desc">${city.desc}</p>
    <div class="det-tips">${city.tips.map(t=>`<div class="det-tip"><span class="det-arr">→</span>${t}</div>`).join('')}</div>
  `;

  detail.classList.add('open');
  document.getElementById('nav-prev').disabled = i===0;
  document.getElementById('nav-next').disabled = i===CITIES.length-1;
  document.getElementById('nav-prev').style.opacity = i===0 ? '.3' : '1';
  document.getElementById('nav-next').style.opacity = i===CITIES.length-1 ? '.3' : '1';
}

document.getElementById('detail-back').addEventListener('click', () => {
  detail.classList.remove('open');
  setActiveMarker(-1);
});
document.getElementById('nav-prev').addEventListener('click', () => {
  if(activeCity > 0) openDetail(activeCity - 1);
});
document.getElementById('nav-next').addEventListener('click', () => {
  if(activeCity < CITIES.length-1) openDetail(activeCity + 1);
});

// ── CITY LIST ──
function buildCityList(){
  const list = document.getElementById('city-list');
  CITIES.forEach((city, i) => {
    const el = document.createElement('div');
    el.className = 'city-item';
    el.innerHTML = `
      <div class="city-item-num">${String(city.id).padStart(2,'0')}</div>
      <div class="city-item-info">
        <div class="city-item-name">${city.name}</div>
        <div class="city-item-date">${city.dates}</div>
      </div>
      <div class="city-item-days">${city.days}</div>
    `;
    el.addEventListener('click', () => openDetail(i));
    list.appendChild(el);
  });
}

// ── PROGRESS BAR ──
function buildProgress(){
  const prog = document.getElementById('route-progress');
  CITIES.forEach((city, i) => {
    if(i > 0){
      const line = document.createElement('div');
      line.className='prog-line';
      prog.appendChild(line);
    }
    const stop = document.createElement('div');
    stop.className = 'prog-stop';
    stop.innerHTML = `<div class="prog-dot"></div><div class="prog-num">${String(city.id).padStart(2,'0')}</div>`;
    stop.addEventListener('click', () => openDetail(i));
    prog.appendChild(stop);
  });
}

// ── ZOOM / PAN ──
let isDragging = false, dragStart = {x:0,y:0}, dragOrig = {x:0,y:0};

canvas.addEventListener('mousedown', e => {
  isDragging=true; dragStart={x:e.clientX,y:e.clientY};
  dragOrig={x:VIEW.offsetX,y:VIEW.offsetY};
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  VIEW.offsetX = dragOrig.x + (e.clientX - dragStart.x);
  VIEW.offsetY = dragOrig.y + (e.clientY - dragStart.y);
  draw(); updateMarkers();
});
window.addEventListener('mouseup', () => { isDragging=false; canvas.classList.remove('dragging') });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.88;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  VIEW.offsetX = mx - (mx - VIEW.offsetX) * factor;
  VIEW.offsetY = my - (my - VIEW.offsetY) * factor;
  VIEW.scale *= factor;
  VIEW.scale = Math.min(Math.max(VIEW.scale, 0.5), 5);
  draw(); updateMarkers();
}, {passive:false});

// Touch
let lastTouchDist = 0, touchStart = null;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length===1){
    touchStart = {x:e.touches[0].clientX,y:e.touches[0].clientY,ox:VIEW.offsetX,oy:VIEW.offsetY};
  } else if(e.touches.length===2){
    lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
canvas.addEventListener('touchmove', e => {
  if(e.touches.length===1 && touchStart){
    VIEW.offsetX = touchStart.ox + e.touches[0].clientX - touchStart.x;
    VIEW.offsetY = touchStart.oy + e.touches[0].clientY - touchStart.y;
    draw(); updateMarkers();
  } else if(e.touches.length===2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    VIEW.scale *= d/lastTouchDist;
    VIEW.scale = Math.min(Math.max(VIEW.scale,0.5),5);
    lastTouchDist = d;
    draw(); updateMarkers();
  }
  e.preventDefault();
},{passive:false});

document.getElementById('zoom-in').addEventListener('click', () => {
  VIEW.scale = Math.min(VIEW.scale*1.25, 5); draw(); updateMarkers();
});
document.getElementById('zoom-out').addEventListener('click', () => {
  VIEW.scale = Math.max(VIEW.scale*0.8, 0.5); draw(); updateMarkers();
});
document.getElementById('reset-view').addEventListener('click', () => {
  VIEW.offsetX=0; VIEW.offsetY=0; VIEW.scale=1; draw(); updateMarkers();
});

// ── RESIZE ──
function resize(){
  const rect = area.getBoundingClientRect();
  canvas.width  = rect.width;
  canvas.height = rect.height;
  draw(); updateMarkers();
}
const ro = new ResizeObserver(resize);
ro.observe(area);

// ── ANIMATE ROUTE ──
function animateRoute(){
  const duration = 2600; // ms
  const start = performance.now();
  function step(now){
    routeProgress = Math.min((now-start)/duration, 1);
    draw(); updateMarkers();
    if(routeProgress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ── INIT ──
buildMarkers();
buildCityList();
buildProgress();
resize();
setTimeout(animateRoute, 300);
</script>
