<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Interactivo — Italia Roadtrip</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:    #141e2e;
  --paper:  #f4efe4;
  --card:   #ede8dc;
  --line:   #ddd8cc;
  --stone:  #7a7068;
  --route:  #2563c4;
  --red:    #d4370f;
  --olive:  #4a6741;
  --amber:  #e8941a;
  --w:      #ffffff;
}
html,body{height:100%;overflow:hidden;font-family:'Barlow',sans-serif;background:var(--ink)}

/* ── LAYOUT ── */
.app{display:flex;height:100vh}

/* ── MAP ── */
.map-area{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 40% 30%,#1a2744 0%,#0e1626 55%,#080e1a 100%)}
#map-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#map-canvas.drag{cursor:grabbing}

/* ── MARKERS ── */
.markers{position:absolute;inset:0;pointer-events:none}
.marker{
  position:absolute;pointer-events:all;cursor:pointer;
  transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;
}
.marker-ring{
  width:20px;height:20px;border-radius:50%;
  border:2px solid var(--red);background:rgba(8,14,26,.9);
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s,border-color .16s,background .16s;
  position:relative;z-index:2;
}
.marker-ring::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  background:rgba(212,55,15,.15);opacity:0;transition:opacity .16s;
}
.marker.active .marker-ring,.marker:hover .marker-ring{background:var(--red);border-color:var(--red);transform:scale(1.35)}
.marker.active .marker-ring::before,.marker:hover .marker-ring::before{opacity:1}
.marker-pip{width:5px;height:5px;border-radius:50%;background:var(--red);transition:background .16s}
.marker.active .marker-pip,.marker:hover .marker-pip{background:var(--w)}
.marker-num{
  position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;
  background:var(--route);font-size:6.5px;font-weight:800;color:var(--w);
  display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;border:1.5px solid var(--ink);
}
.marker-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.7);margin-top:5px;white-space:nowrap;
  text-shadow:0 1px 5px rgba(0,0,0,.95);transition:color .16s;
}
.marker.active .marker-label,.marker:hover .marker-label{color:var(--w)}
.marker.optional-marker .marker-ring{border-color:var(--olive);border-style:dashed}
.marker.optional-marker .marker-pip{background:var(--olive)}

/* ── PANEL ── */
.panel{
  width:360px;flex-shrink:0;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden;
  border-left:1px solid rgba(255,255,255,.06);
}
.panel-header{background:var(--ink);padding:22px 26px 18px;flex-shrink:0}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--w)}
.panel-sub{font-size:11px;color:rgba(255,255,255,.38);margin-top:2px}

/* Progress dots */
.progress{display:flex;align-items:center;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.progress::-webkit-scrollbar{display:none}
.p-stop{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;cursor:pointer;padding:0 4px;opacity:.35;transition:opacity .14s}
.p-stop:hover,.p-stop.on{opacity:1}
.p-dot{width:7px;height:7px;border-radius:50%;background:var(--stone);border:1.5px solid var(--stone);transition:background .14s,border-color .14s}
.p-stop.on .p-dot{background:var(--red);border-color:var(--red)}
.p-stop.optional .p-dot{border-color:var(--olive);background:transparent}
.p-stop.on.optional .p-dot{background:var(--olive)}
.p-n{font-size:7px;font-weight:700;color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.p-stop.on .p-n{color:var(--red)}
.p-line{width:12px;height:1px;background:rgba(255,255,255,.12);flex-shrink:0;align-self:center}

/* City list */
.city-list{flex:1;overflow-y:auto}
.city-list::-webkit-scrollbar{width:3px}
.city-list::-webkit-scrollbar-thumb{background:var(--line)}
.city-item{
  display:flex;align-items:center;gap:12px;padding:11px 26px;cursor:pointer;
  border-bottom:1px solid var(--line);transition:background .1s;position:relative;
}
.city-item:hover{background:rgba(37,99,196,.04)}
.city-item.active{background:rgba(37,99,196,.07)}
.city-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--route)}
.c-num{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;color:var(--stone);font-variant-numeric:tabular-nums;width:18px;flex-shrink:0}
.city-item.active .c-num{color:var(--route)}
.c-info{flex:1;min-width:0}
.c-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;text-transform:uppercase;color:var(--ink)}
.c-date{font-size:10px;color:var(--stone);font-weight:500;margin-top:1px}
.c-days{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--stone);flex-shrink:0}
.city-item.optional-item .c-name{color:var(--olive)}
.opt-pill{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(74,103,65,.12);color:var(--olive);padding:2px 6px;border:1px solid rgba(74,103,65,.25);margin-left:6px;vertical-align:middle}

/* ── DETAIL ── */
.detail{
  position:absolute;inset:0;background:var(--paper);
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;z-index:10;
}
.detail.open{transform:translateX(0)}
.det-top{background:var(--ink);padding:18px 22px;flex-shrink:0;display:flex;align-items:flex-start;gap:10px}
.det-back{background:none;border:none;color:rgba(255,255,255,.45);font-size:18px;cursor:pointer;padding:0;line-height:1;transition:color .14s;flex-shrink:0;margin-top:1px}
.det-back:hover{color:var(--w)}
.det-back:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.det-head{flex:1}
.det-stop{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.det-city{font-family:'Barlow Condensed',sans-serif;font-size:clamp(26px,5vw,34px);font-weight:900;color:var(--w);line-height:1;text-transform:uppercase;text-wrap:balance}
.det-region{font-size:10px;color:rgba(255,255,255,.38);font-weight:500;margin-top:4px;letter-spacing:.1em;text-transform:uppercase}
.det-body{flex:1;overflow-y:auto;padding:20px 22px}
.det-body::-webkit-scrollbar{width:3px}
.det-body::-webkit-scrollbar-thumb{background:var(--line)}
.d-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.d-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.d-val{font-size:13px;font-weight:700;color:var(--ink)}
.d-km{display:inline-flex;align-items:center;gap:5px;margin-top:12px;background:rgba(37,99,196,.08);color:var(--route);font-size:10px;font-weight:700;letter-spacing:.07em;padding:4px 10px;font-variant-numeric:tabular-nums}
.d-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px}
.d-tag{background:var(--card);color:var(--ink);font-size:11px;font-weight:600;padding:3px 9px}
.d-tag.r{background:var(--red);color:var(--w)}
.d-tag.b{background:var(--route);color:var(--w)}
.d-tag.g{background:var(--olive);color:var(--w)}
.d-desc{font-size:13px;line-height:1.72;color:#3d3530;margin-top:13px}
.d-tips{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.d-tip{display:flex;gap:8px;font-size:12px;color:#5a4f47;line-height:1.5}
.d-arr{color:var(--route);font-weight:700;flex-shrink:0}
.d-opt-badge{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:8px;
  background:rgba(74,103,65,.1);color:var(--olive);border:1px solid rgba(74,103,65,.3);
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;
}
/* Nav buttons */
.nav-btns{display:flex;border-top:1px solid var(--line);flex-shrink:0}
.nav-btn{
  flex:1;padding:13px;background:none;border:none;cursor:pointer;
  font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--stone);transition:background .1s,color .1s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.nav-btn:hover{background:var(--card);color:var(--ink)}
.nav-btn:focus-visible{outline:2px solid var(--route);outline-offset:-2px}
.nav-btn+.nav-btn{border-left:1px solid var(--line)}
.nav-btn:disabled{opacity:.28;pointer-events:none}

/* ── CONTROLS ── */
.controls{position:absolute;bottom:24px;left:20px;display:flex;flex-direction:column;gap:7px;z-index:5}
.ctrl{
  width:36px;height:36px;border-radius:3px;
  background:rgba(8,14,26,.85);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.65);font-size:17px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .14s,color .14s;backdrop-filter:blur(8px);
}
.ctrl:hover{background:rgba(255,255,255,.1);color:var(--w)}
.ctrl:focus-visible{outline:2px solid var(--amber)}

/* Legend */
.legend{
  position:absolute;bottom:24px;right:20px;
  background:rgba(8,14,26,.85);border:1px solid rgba(255,255,255,.1);
  padding:12px 14px;font-size:10px;color:rgba(255,255,255,.45);
  backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:7px;
}
.leg-r{display:flex;align-items:center;gap:8px}
.l-solid{width:22px;height:2px;background:var(--route)}
.l-dash{width:22px;height:0;border-top:2px dashed rgba(74,103,65,.8)}

/* Tooltip */
.tt{
  position:fixed;pointer-events:none;z-index:100;
  background:rgba(8,14,26,.92);border:1px solid rgba(255,255,255,.1);
  color:var(--w);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 9px;transform:translate(-50%,-150%);opacity:0;transition:opacity .1s;
  backdrop-filter:blur(8px);white-space:nowrap;
}
.tt.show{opacity:1}

/* Responsive */
@media(max-width:720px){
  .app{flex-direction:column}
  .panel{width:100%;height:44vh;border-left:none;border-top:1px solid rgba(255,255,255,.08)}
  .legend{display:none}
}
@media(prefers-reduced-motion:reduce){.detail,.marker-ring{transition:none}}
</style>
</head>
<body>

<div class="app">
  <div class="map-area" id="map-area">
    <canvas id="map-canvas"></canvas>
    <div class="markers" id="markers"></div>
    <div class="controls">
      <button class="ctrl" id="zi" title="Acercar" aria-label="Acercar">+</button>
      <button class="ctrl" id="zo" title="Alejar" aria-label="Alejar">−</button>
      <button class="ctrl" id="zr" title="Centrar" aria-label="Centrar vista" style="font-size:13px">⌖</button>
    </div>
    <div class="legend">
      <div class="leg-r"><div class="l-solid"></div><span>Ruta principal</span></div>
      <div class="leg-r"><div class="l-dash"></div><span>Parada opcional</span></div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-title">Italia Roadtrip</div>
      <div class="panel-sub">21 Dic 2025 – 10 Ene 2026 · 12 ciudades + Sicilia opcional</div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="city-list" id="city-list"></div>

    <div class="detail" id="detail">
      <div class="det-top">
        <button class="det-back" id="det-back" aria-label="Volver">←</button>
        <div class="det-head">
          <div class="det-stop" id="d-stop"></div>
          <div class="det-city" id="d-city"></div>
          <div class="det-region" id="d-region"></div>
        </div>
      </div>
      <div class="det-body" id="d-body"></div>
      <div class="nav-btns">
        <button class="nav-btn" id="n-prev">← Anterior</button>
        <button class="nav-btn" id="n-next">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<div class="tt" id="tt"></div>

    tips:['Vuelo corto Nápoles → Palermo o Catania — ~1h desde €30 con Ryanair.','Ferry nocturno Nápoles–Palermo (11h) — económico y experiencia única.','Palermo + Siracusa es el circuito mínimo. Con 3 días agregar Taormina y el Etna.','La arancina en el Mercato Ballarò de Palermo — imprescindible.']
  }
];

// ── CANVAS MAP ──
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
const area = document.getElementById('map-area');
const GEO = { lonMin:7.2, lonMax:19.0, latMin:36.2, latMax:47.3 };
let VIEW = { ox:0, oy:0, s:1 };

function geoToNorm(lon,lat){
  return [(lon-GEO.lonMin)/(GEO.lonMax-GEO.lonMin), 1-(lat-GEO.latMin)/(GEO.latMax-GEO.latMin)];
}
function nToC(nx,ny){
  const W=canvas.width,H=canvas.height;
  const mw=W*.78,mh=H*.88,mx=(W-mw)/2,my=(H-mh)/2;
  return [VIEW.ox+mx+nx*mw*VIEW.s, VIEW.oy+my+ny*mh*VIEW.s];
}
function geoToC(lon,lat){ return nToC(...geoToNorm(lon,lat)); }

// Italy outline (geographic coords)
const ITALY=[
  [7.0,44.0],[7.5,44.2],[8.0,44.0],[8.5,44.1],[9.0,44.2],[9.5,45.0],
  [10.0,45.8],[10.5,46.0],[11.0,46.5],[11.5,46.6],[12.0,46.7],[12.5,46.8],
  [13.0,46.6],[13.5,46.3],[13.8,45.8],[13.7,45.7],[13.5,45.7],[13.0,45.5],
  [13.6,45.6],[13.8,45.5],[13.5,45.0],[13.4,44.5],[13.8,44.0],[14.2,43.5],
  [14.5,42.9],[14.9,42.2],[15.2,41.8],[15.5,41.3],[15.8,40.6],[16.2,40.0],
  [16.6,39.5],[17.0,39.0],[17.5,38.6],[18.0,38.2],[18.5,38.1],[18.2,38.0],
  [18.0,38.1],[18.3,38.4],[18.4,38.9],[17.9,39.1],[17.5,39.2],[16.8,39.5],
  [16.5,38.7],[16.0,38.0],[15.7,37.9],[15.6,38.0],[15.9,38.2],[16.1,38.5],
  [16.0,39.0],[15.7,39.5],[15.3,40.0],[15.0,40.3],[14.7,40.6],
  [14.5,40.5],[14.2,40.6],[13.9,40.8],[13.5,41.2],[13.2,41.5],
  [12.8,41.8],[12.4,42.0],[12.0,42.2],[11.6,42.4],[11.2,42.5],
  [10.8,42.6],[10.5,43.0],[10.2,43.3],[9.9,43.8],[9.7,44.2],[9.0,44.0],
  [8.5,43.8],[8.0,43.7],[7.5,43.5],[7.0,43.8],[6.8,44.0],[7.0,44.0]
];
const SICILY=[[12.4,38.2],[13.0,37.8],[13.5,37.5],[14.5,37.3],[15.1,37.5],[15.6,37.7],[15.4,38.1],[15.0,38.2],[14.5,38.0],[14.0,38.1],[13.5,38.0],[13.0,38.2],[12.5,38.2],[12.4,38.2]];
const SARDINIA=[[8.4,38.9],[8.8,38.8],[9.2,39.0],[9.5,39.2],[9.6,39.8],[9.5,40.5],[9.2,41.0],[8.8,41.2],[8.5,41.0],[8.3,40.5],[8.2,40.0],[8.1,39.5],[8.3,39.0],[8.4,38.9]];

function drawLand(pts,fillA,strokeA){
  ctx.beginPath();
  pts.forEach(([lon,lat],i)=>{ const[x,y]=geoToC(lon,lat); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.closePath();
  ctx.fillStyle=fillA; ctx.fill();
  ctx.strokeStyle=strokeA; ctx.lineWidth=1.5; ctx.stroke();
}

let routeProg=0;

function drawMap(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.025)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  drawLand(ITALY,'rgba(255,255,255,0.07)','rgba(255,255,255,0.2)');
  drawLand(SICILY,'rgba(255,255,255,0.06)','rgba(255,255,255,0.16)');
  drawLand(SARDINIA,'rgba(255,255,255,0.04)','rgba(255,255,255,0.12)');

  // Mainland route (stops 0–11)
  const mainCities = CITIES.filter(c=>!c.optional);
  const n = mainCities.length;
  const frac = routeProg;
  const segIdx = Math.min(Math.floor(frac*(n-1)), n-2);
  const segFrac = (frac*(n-1))%1;

  ctx.save();
  ctx.strokeStyle='#2563c4'; ctx.lineWidth=2.5;
  ctx.setLineDash([8,5]); ctx.lineDashOffset=-routeProg*300;
  ctx.beginPath();
  for(let i=0;i<n-1;i++){
    const[ax,ay]=geoToC(mainCities[i].lon,mainCities[i].lat);
    const[bx,by]=geoToC(mainCities[i+1].lon,mainCities[i+1].lat);
    if(i===0) ctx.moveTo(ax,ay);
    if(i<segIdx) ctx.lineTo(bx,by);
    else if(i===segIdx){ ctx.lineTo(ax+(bx-ax)*segFrac,ay+(by-ay)*segFrac); break; }
  }
  ctx.stroke(); ctx.restore();

  // Optional Sicily dashed line from Napoli
  if(routeProg>=1){
    const napoli = CITIES[10];
    const sicilia = CITIES[12];
    const[nx,ny]=geoToC(napoli.lon,napoli.lat);
    const[sx,sy]=geoToC(sicilia.lon,sicilia.lat);
    ctx.save();
    ctx.strokeStyle='rgba(74,103,65,0.7)'; ctx.lineWidth=1.8;
    ctx.setLineDash([5,6]);
    ctx.beginPath(); ctx.moveTo(nx,ny); ctx.lineTo(sx,sy); ctx.stroke();
    ctx.restore();
  }
}

// ── MARKERS ──
const markersEl=document.getElementById('markers');
const mEls=[];

function buildMarkers(){
  CITIES.forEach((city,i)=>{
    const el=document.createElement('div');
    el.className='marker'+(city.optional?' optional-marker':'');
    el.innerHTML=`<div class="marker-ring"><div class="marker-pip"></div><div class="marker-num">${city.optional?'+':city.id}</div></div><div class="marker-label">${city.name.split(' ')[0]}</div>`;
    el.addEventListener('click',()=>openDetail(i));
    el.addEventListener('mouseenter',e=>showTt(e,city.name));
    el.addEventListener('mouseleave',hideTt);
    markersEl.appendChild(el);
    mEls.push(el);
  });
}

function updateMarkers(){
  const W=canvas.width,H=canvas.height;
  const mw=W*.78,mh=H*.88,mx=(W-mw)/2,my=(H-mh)/2;
  CITIES.forEach((city,i)=>{
    const el=mEls[i];
    if(!el) return;
    const[nx,ny]=geoToNorm(city.lon,city.lat);
    const x=VIEW.ox+mx+nx*mw*VIEW.s;
    const y=VIEW.oy+my+ny*mh*VIEW.s;
    el.style.left=x+'px'; el.style.top=y+'px';
    const show = city.optional ? routeProg>=1 : routeProg>=i/(CITIES.filter(c=>!c.optional).length-1)-0.02;
    el.style.opacity=show?'1':'0';
    el.style.pointerEvents=show?'all':'none';
  });
}

let activeIdx=-1;
function setActive(i){
  mEls.forEach((el,j)=>el.classList.toggle('active',j===i));
  document.querySelectorAll('.city-item').forEach((el,j)=>el.classList.toggle('active',j===i));
  document.querySelectorAll('.p-stop').forEach((el,j)=>el.classList.toggle('on',j===i));
  activeIdx=i;
}

// ── TOOLTIP ──
const tt=document.getElementById('tt');
function showTt(e,text){ tt.textContent=text; tt.style.left=e.clientX+'px'; tt.style.top=e.clientY+'px'; tt.classList.add('show'); }
function hideTt(){ tt.classList.remove('show'); }

// ── DETAIL ──
const detail=document.getElementById('detail');
function openDetail(i){
  const c=CITIES[i];
  setActive(i);
  document.getElementById('d-stop').textContent=c.optional?'Parada Opcional':`Parada ${String(c.id).padStart(2,'0')} de 12`;
  document.getElementById('d-city').textContent=c.name;
  document.getElementById('d-region').textContent=c.region;
  const tagsHtml=[
    ...c.tags.map(t=>`<span class="d-tag">${t}</span>`),
    ...c.hot.map(t=>`<span class="d-tag r">${t}</span>`),
    ...c.blue.map(t=>`<span class="d-tag b">${t}</span>`),
    ...c.green.map(t=>`<span class="d-tag g">${t}</span>`)
  ].join('');
  const body=document.getElementById('d-body');
  body.innerHTML=`
    ${c.optional?'<div class="d-opt-badge">Extensión opcional</div>':''}
    <div class="d-row"><span class="d-lbl">Fechas</span><span class="d-val">${c.dates}</span></div>
    <div class="d-row"><span class="d-lbl">Duración</span><span class="d-val">${c.days}</span></div>
    ${c.km?`<div class="d-km">↔ ${c.km}</div>`:''}
    <div class="d-tags">${tagsHtml}</div>
    <p class="d-desc">${c.desc}</p>
    <div class="d-tips">${c.tips.map(t=>`<div class="d-tip"><span class="d-arr">→</span>${t}</div>`).join('')}</div>
  `;
  detail.classList.add('open');
  const prev=document.getElementById('n-prev');
  const next=document.getElementById('n-next');
  prev.disabled=i===0;
  next.disabled=i===CITIES.length-1;
}
document.getElementById('det-back').addEventListener('click',()=>{ detail.classList.remove('open'); setActive(-1); });
document.getElementById('n-prev').addEventListener('click',()=>{ if(activeIdx>0) openDetail(activeIdx-1); });
document.getElementById('n-next').addEventListener('click',()=>{ if(activeIdx<CITIES.length-1) openDetail(activeIdx+1); });

// ── CITY LIST & PROGRESS ──
function buildList(){
  const list=document.getElementById('city-list');
  CITIES.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='city-item'+(c.optional?' optional-item':'');
    el.innerHTML=`
      <div class="c-num">${c.optional?'+':String(c.id).padStart(2,'0')}</div>
      <div class="c-info">
        <div class="c-name">${c.name}${c.optional?'<span class="opt-pill">opcional</span>':''}</div>
        <div class="c-date">${c.dates}</div>
      </div>
      <div class="c-days">${c.days}</div>
    `;
    el.addEventListener('click',()=>openDetail(i));
    list.appendChild(el);
  });
}

function buildProgress(){
  const prog=document.getElementById('progress');
  CITIES.forEach((c,i)=>{
    if(i>0){ const l=document.createElement('div'); l.className='p-line'; prog.appendChild(l); }
    const s=document.createElement('div');
    s.className='p-stop'+(c.optional?' optional':'');
    s.innerHTML=`<div class="p-dot"></div><div class="p-n">${c.optional?'+':String(c.id).padStart(2,'0')}</div>`;
    s.addEventListener('click',()=>openDetail(i));
    prog.appendChild(s);
  });
}

// ── ZOOM / PAN ──
let dragging=false,ds={x:0,y:0},do_={ox:0,oy:0};
canvas.addEventListener('mousedown',e=>{ dragging=true; ds={x:e.clientX,y:e.clientY}; do_={ox:VIEW.ox,oy:VIEW.oy}; canvas.classList.add('drag'); });
window.addEventListener('mousemove',e=>{ if(!dragging) return; VIEW.ox=do_.ox+(e.clientX-ds.x); VIEW.oy=do_.oy+(e.clientY-ds.y); drawMap(); updateMarkers(); });
window.addEventListener('mouseup',()=>{ dragging=false; canvas.classList.remove('drag'); });
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.89;
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  VIEW.ox=mx-(mx-VIEW.ox)*f; VIEW.oy=my-(my-VIEW.oy)*f;
  VIEW.s=Math.min(Math.max(VIEW.s*f,.45),5);
  drawMap(); updateMarkers();
},{passive:false});

let ltd=0,tst=null;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){ tst={x:e.touches[0].clientX,y:e.touches[0].clientY,ox:VIEW.ox,oy:VIEW.oy}; }
  else if(e.touches.length===2){ ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&tst){ VIEW.ox=tst.ox+(e.touches[0].clientX-tst.x); VIEW.oy=tst.oy+(e.touches[0].clientY-tst.y); drawMap(); updateMarkers(); }
  else if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); VIEW.s=Math.min(Math.max(VIEW.s*d/ltd,.45),5); ltd=d; drawMap(); updateMarkers(); }
  e.preventDefault();
},{passive:false});

document.getElementById('zi').addEventListener('click',()=>{ VIEW.s=Math.min(VIEW.s*1.25,5); drawMap(); updateMarkers(); });
document.getElementById('zo').addEventListener('click',()=>{ VIEW.s=Math.max(VIEW.s*.8,.45); drawMap(); updateMarkers(); });
document.getElementById('zr').addEventListener('click',()=>{ VIEW.ox=0; VIEW.oy=0; VIEW.s=1; drawMap(); updateMarkers(); });

// ── RESIZE ──
function resize(){
  const r=area.getBoundingClientRect();
  canvas.width=r.width; canvas.height=r.height;
  drawMap(); updateMarkers();
}
new ResizeObserver(resize).observe(area);

// ── ANIMATE ──
function animate(){
  const t0=performance.now();
  const dur=2800;
  function step(now){
    routeProg=Math.min((now-t0)/dur,1);
    drawMap(); updateMarkers();
    if(routeProg<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

buildMarkers(); buildList(); buildProgress();
resize();
setTimeout(animate,300);
</script>
</body>
</html>
